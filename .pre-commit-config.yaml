repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format
        language: system
        types: [python]

      - id: pytest
        name: Run tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true